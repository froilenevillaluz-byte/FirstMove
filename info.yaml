# Tiny Tapeout project information (Wokwi project)
project:
  wokwi_id:     0       # Set this to the ID of your Wokwi project (the number from the project's URL)
  title:        "FirstMove: Rock, Paper, Scissors vs the Chip"      # Project title
  author:       "froileneee"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Play rock-paper-scissors against the chip; it picks its move with an internal LFSR and tracks your win/loss record."      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000     # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  top_module: "tt_um_froileneee_rps"
  source_files:
  - "project.v"


# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "player move bit 0"
  ui[1]: "player move bit 1"
  ui[2]: "PLAY button"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "player move bit 0 (echo)"
  uo[1]: "player move bit 1 (echo)"
  uo[2]: "chip move bit 0"
  uo[3]: "chip move bit 1"
  uo[4]: "result bit 0 (0=tie,1=win,2=lose)"
  uo[5]: "result bit 1"
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "win count bit 0"
  uio[1]: "win count bit 1"
  uio[2]: "win count bit 2"
  uio[3]: "win count bit 3"
  uio[4]: "loss count bit 0"
  uio[5]: "loss count bit 1"
  uio[6]: "loss count bit 2"
  uio[7]: "loss count bit 3"

# Do not change!
yaml_version: 6
